<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><title>Product details | Smart Farm</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/marketplace.css"><link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/app-theme.css">
</head><body><nav class="market-nav"><strong>SMART FARM / PRODUCT</strong><a href="marketplace.html">Marketplace</a><a href="cart.html">Cart</a></nav><main class="market-shell"><section id="product" class="two-col">Loading product...</section></main><script>const id=new URLSearchParams(location.search).get('id');fetch('/api/marketplace/products/'+id).then(r=>r.json()).then(d=>{const p=d.product;document.querySelector('#product').innerHTML=`<section class="panel"><img style="width:100%;max-height:500px;object-fit:cover" src="${p.images?.[0]||'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=900&q=80'}" alt="${p.name}"></section><section class="panel"><p>${p.category} Â· ${p.organic?'Organic':''}</p><h1>${p.name}</h1><p>${p.description||'Fresh farm produce.'}</p><h2>â‚¹${p.price} / ${p.unit}</h2><p>${p.quantity} ${p.unit} available Â· minimum ${p.min_order_quantity}</p><p>Farmer: ${p.farmer?.name||'Farmer'} Â· ${p.farmer_profile?.village||p.village||'Location pending'}</p><button id="add">Add to cart</button></section>`;document.querySelector('#add').onclick=async()=>{const r=await fetch('/api/marketplace/cart/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:p.id,quantity:p.min_order_quantity})});if(r.ok){location.href='cart.html';return}const error=(await r.json()).error;if(error==='authentication_required'){location.href='../pages/login.html?next='+encodeURIComponent(location.pathname+location.search);return}alert(error)}}).catch(e=>document.querySelector('#product').textContent=e.message)</script>
<script src="../js/app-navigation.js" defer></script>
<script src="../js/site-language.js" defer></script>
</body></html>
