<!doctype html>
<html lang="hi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><title>Farmer Marketplace | Sell Your Product</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/marketplace.css"><link rel="stylesheet" href="css/marketplace-responsive.css"><link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/app-theme.css">
</head>
<body><nav class="market-nav"><strong>FARMER MARKETPLACE</strong><a href="marketplace.html">Marketplace Home</a><a href="farmer-dashboard.html">My Products</a><a href="my-orders.html">My Orders</a><a href="farmer-profile.html">My Profile</a><a href="../pages/index.html">Smart Farm</a></nav><main class="market-shell"><header class="market-head"><div><p>SELL YOUR PRODUCT</p><h1>List what your farm grows.</h1><p>Add clear details so nearby buyers can find and order your harvest.</p></div></header><form id="sell-form" class="panel form-grid"><div class="field"><label>Product name</label><input name="name" required maxlength="120" placeholder="e.g. Fresh tomatoes"></div><div class="field"><label>Category</label><select name="category" required><option>Vegetable</option><option>Fruit</option><option>Grain</option><option>Wheat</option><option>Rice</option><option>Pulses</option><option>Seed</option><option>Fertilizer</option><option>Other</option></select></div><div class="field"><label>Product type</label><input name="product_type" required></div><div class="field"><label>Price</label><input name="price" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Unit</label><select name="unit"><option>kg</option><option>quintal</option><option>packet</option><option>piece</option></select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Minimum order</label><input name="min_order_quantity" type="number" min="0.01" step="0.01" value="1" required></div><div class="field"><label>Harvest date</label><input name="harvest_date" type="date"></div><div class="field"><label>Pickup location</label><input name="farm_location" required></div><div class="field"><label>Expected delivery</label><input name="delivery_time"></div><div class="field"><label>Product photo (optional)</label><input name="product_image" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG or WebP - up to 5 MB</small></div><div class="field"><label><input name="organic" type="checkbox"> Organic product</label></div><div class="field full"><label>Description and quality details</label><textarea name="description" rows="4" maxlength="3000"></textarea></div><div class="full publish-row"><button type="submit">Publish product</button><span id="message" class="profile-message" role="status" aria-live="polite"></span></div></form></main><script src="js/sell-product.js"></script>
<script src="../js/app-navigation.js" defer></script>
<script src="../js/site-language.js" defer></script>
</body></html>
